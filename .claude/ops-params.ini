; Operating parameters of the agent workflow: the single source of truth.
; Printed by .claude/hooks/session_brief.py at every session start. Other docs
; point here instead of restating these numbers. Format: configparser; one
; why comment per key (with the date of the decision where known).

[lanes]
; Engineer lanes running at once. Maintainer, 2026-11-10. Reviewers, verifiers
; and doc agents are not lanes.
engineers = 2

[ci]
; Fast loop: a filtered run is quick; full host once per branch, 2026-11-10.
iterate = O3OS_CI_TESTS filter on the touched or failing tests; goldens first when screens change
; A scoped run can hide a break elsewhere, so merge needs the full run: tools/land.py runs it once, on the merge result, and dev
; moves only when it is green (the green cache skips a tree that already passed). Engineers run filtered tests only (maintainer, 2026-11-11).
merge_gate = full host rc=0 of the merge result, run by tools/land.py; engineers run filtered tests only, no full host
; The expensive stages run once per batch, not per slice.
batch = one full host + qemu + mk66 per batch or integration branch, and before every image
; Target goldens only run under qemu.
qemu_when = audio, modules, DSP or platform changed
; Avoids redundant CI on identical firmware code.
reuse = a passed result is reused when the code diff excluding docs is empty
; Remote build machine threads with one lane running, 2026-11-10. Since OS-OPS-CISPEED (2026-11-11) an unset
; Remote jobs are auto (nproc/(busy turns+1), at least 4); an O3OS_REMOTE_JOBS set anywhere is only a ceiling on that (OS-OPS-JOBSCAP). Kept as the manual values.
remote_jobs_one_lane = 16
; Remote build machine threads each with two lanes running, 2026-11-10 (auto picks it from the machine's load).
remote_jobs_two_lanes = 8
; Local build jobs of a lane outside the CI lock, to keep the machine usable.
local_jobs = 4
; Local ctest jobs outside the CI lock, to keep the machine usable.
local_ctest_jobs = 2

[agents]
; Long-lived engineers lose focus and context (incidents 2026-10-16, 2026-10-22).
findings_per_engineer = 2
; Context size (tokens) at which an engineer commits what is green and wraps up.
warn_ctx = 120000
; Context size (tokens) above which an engineer with no commit is stopped.
; Enforced by .claude/hooks/ctx_cap.py (PreToolUse, subagents only).
stop_ctx_no_commit = 150000
; Hard context cap (tokens) for any agent. Enforced by .claude/hooks/ctx_cap.py:
; over it every tool call is denied except git wrap-up and build-remote/STATE.md.
hard_ctx = 250000
; Cap on the words of an agent report, to keep token spend low.
report_words = 300

[backlog]
; Max rows IN PROGRESS at once (the lane count is under [lanes]).
in_progress_max = 3
; Max rows QUEUED at once, so the queue stays reviewable.
queued_max = 6
