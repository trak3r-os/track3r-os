# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release mechanism (OS-RELEASE-ptf): a pushed tag v* builds the MK66 device image twice from clean build directories, refuses to go on unless
# the two images are byte-identical and pass the static image checks, and creates a DRAFT release with the update file
# (track3r-os-<tag>.ptf, the image's Intel HEX under a .ptf name) and its SHA256SUMS. Nothing is published by this workflow: the maintainer
# reads the draft and publishes it by hand. The image is never flashed; docs/manual/install.md says how a person installs it.
#
# A release can be redone without touching the tag: Actions, release, Run workflow, and type the tag (for example v1.0.0). The run builds
# that tag whatever branch it was started from. `gh release create` refuses a tag that already has a release, so delete the earlier draft first.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to build and draft a release for, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ptf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}   # by hand: the tag that was typed; on a tag push: the tag pushed
          fetch-depth: 0   # the image's version comes from `git describe`, which needs the tags
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ python3 xz-utils curl
      - name: Cache the Arm GNU toolchain archive
        uses: actions/cache@v4
        with:
          path: arm-archive
          key: ${{ runner.os }}-${{ hashFiles('tools/ci.sh') }}
      - name: Unpack the pinned Arm GNU toolchain
        env:
          O3OS_CI_ARCHIVE_DIR: ${{ github.workspace }}/arm-archive
        run: tools/ci.sh toolchain
      - name: Check the tag and the update file name
        # The unit's path guard takes [0-9A-Za-z][0-9A-Za-z._-]{0,25}.ptf (at most 30 characters in all: the SD bootloader may flash another file on a longer name, OS-BUG-FWNAMELEN) and the file must not look like an official one (no "Polyend" prefix).
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "tag $TAG is not v<major>.<minor>.<patch>[-suffix]"; exit 1; }
          name="track3r-os-${TAG}.ptf"
          [[ "$name" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,25}\.ptf$ && "$name" != *..* ]] || { echo "$name (${#name} characters) is not a name the unit accepts: at most 30 characters with .ptf (stem of 26 at most), so the tag $TAG is too long"; exit 1; }
          echo "PTF=$name" >> "$GITHUB_ENV"
      - name: Build the MK66 image twice in fresh directories
        run: |
          set -euo pipefail
          export ARM_GNU_ROOT="$PWD/.toolchains/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi"
          for d in a b; do
            rm -rf "build-release-$d"
            cmake -S . -B "build-release-$d" -DO3OS_PLATFORM=mk66 "-DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/mk66-toolchain.cmake" "-DARM_GNU_ROOT=$ARM_GNU_ROOT" 2>&1 | tee "build-release-$d.log"
            cmake --build "build-release-$d" -j4 2>&1 | tee -a "build-release-$d.log"
            # The same rule as tools/ci.sh: any warning stops the release.
            if grep -nEi 'warning[:(]|CMake (Deprecation )?Warning' "build-release-$d.log"; then echo "warnings in build $d"; exit 1; fi
          done
      - name: Both images must be identical
        run: cmp build-release-a/platform/mk66/o3os.hex build-release-b/platform/mk66/o3os.hex
      - name: Image checks
        # What `tools/ci.sh mk66` runs (the ctests include mk66_image, mk66_flashconfig, mk66_ld), then the static checks of the fw-gate-check skill.
        run: |
          set -euo pipefail
          export O3_FIXTURES_DIR="$PWD/build-release-a/no-fixtures" O3_CI=1   # as tools/ci.sh: no fixtures, no skipping
          ctest --test-dir build-release-a --output-on-failure --no-tests=error -j2
          python3 -I platform/mk66/tools/check_image.py check build-release-a/platform/mk66/o3os.hex --expect-sp 0x20030000 --ramfunc-l 0x1FFF0000:0xC000
          python3 -I platform/mk66/tools/check_image.py flashconfig build-release-a/platform/mk66/o3os.hex --expect ffffffffffffffffffffffffdef9ffff
      - name: Make the update file, checksums and release notes
        run: |
          set -euo pipefail
          mkdir release
          cp build-release-a/platform/mk66/o3os.hex "release/$PTF"
          cd release
          sha256sum "$PTF" > SHA256SUMS
          SHA=$(cut -d' ' -f1 SHA256SUMS)
          # The CRC-32 of the file's bytes: the value `o3console.py --update ... --crc` expects (the `ok` line of its --put prints the same).
          CRC=$(python3 -I -c 'import sys, zlib; print("%08X" % (zlib.crc32(open(sys.argv[1], "rb").read()) & 0xFFFFFFFF))' "$PTF")
          cat > ../notes.md <<NOTES
          track3r-os ${TAG}: a community operating system for the Polyend Tracker hardware, written from scratch. Update file: \`${PTF}\`.

          > **At your own risk.** This is unofficial community firmware. It is not affiliated with or endorsed by Polyend. Back up your SD card first and keep the official firmware at hand to go back.

          Install guide, including how to go back to the official firmware: [docs/manual/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/manual/install.md)

          | | |
          |---|---|
          | File | \`${PTF}\` |
          | SHA-256 | \`${SHA}\` |
          | CRC-32 (for \`o3console.py --update --crc\`) | \`${CRC}\` |

          Check the download with \`sha256sum -c SHA256SUMS\`. Two clean builds of this tag gave byte-identical images, and the image passed the static checks (Intel HEX, address range, vectors, flash configuration field).

          Source: this tag (GPL-3.0-or-later).
          NOTES
          cat ../notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "release/$PTF" release/SHA256SUMS \
            --draft --verify-tag --title "track3r-os $TAG" --notes-file notes.md
