<text class="t s" x="105" y="164">Sample Loader</text>
<text class="t m" x="105" y="198">Sample load</text>
<rect class="k" x="194" y="136" width="150" height="92" rx="8"/>
<text class="t s" x="269" y="164">Sample Playback</text>
<text class="t m" x="269" y="198">Wave</text>
<rect class="k" x="358" y="136" width="150" height="92" rx="8"/>
<text class="t s" x="433" y="164">Sample Editor</text>
<text class="t m" x="433" y="198">Sample edit</text>
<rect class="k" x="522" y="136" width="150" height="92" rx="8"/>
<text class="t s" x="597" y="164">Sample Recorder</text>
<text class="t m" x="597" y="198">Record</text>
